name: Classify Gerald's Nightly Clips
on:
  schedule:
    # Gerald finishes uploading around 6:35 AM Pacific, which is 13:35 UTC in summer
    # and 14:35 UTC in winter. The runs below are all after that in BOTH
    # seasons (15:00 UTC = 8 AM PDT / 7 AM PST, then two later retries in case
    # an upload was late). Runs with nothing new exit in seconds.
    - cron: '0 15 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      backfill_dates:
        description: 'Comma-separated dates to force-reprocess (e.g. 2026-08-22,2026-08-23). Leave blank for a normal run.'
        required: false
        default: ''
permissions:
  contents: write
# Never let two runs overlap; a second run waits for the first to finish.
concurrency:
  group: classify-nightly
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Set up rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Check for new nights
        id: check
        env:
          BACKFILL_DATES: ${{ github.event.inputs.backfill_dates }}
        run: |
          if [ -n "$BACKFILL_DATES" ]; then
            echo "Backfill requested: $BACKFILL_DATES"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export LC_ALL=C
          rclone lsf gdrive:gerald_backups/ --include "*.zip" --files-only | sed '/^$/d' | sort > remote_zips.txt
          touch done_zips.txt
          if [ -f classifier/processed_nights.txt ]; then
            sed '/^$/d' classifier/processed_nights.txt | sort > done_zips.txt
          fi
          NEW=$(comm -23 remote_zips.txt done_zips.txt)
          if [ -n "$NEW" ]; then
            echo "New nights found:"
            echo "$NEW"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new nights to process."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f remote_zips.txt done_zips.txt
      - name: Set up Python
        if: steps.check.outputs.has_new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        if: steps.check.outputs.has_new == 'true'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        if: steps.check.outputs.has_new == 'true'
        run: pip install -r classifier/requirements.txt
      - name: Run classification pipeline
        if: steps.check.outputs.has_new == 'true'
        env:
          BACKFILL_DATES: ${{ github.event.inputs.backfill_dates }}
        run: python3 classifier/scripts/run_pipeline.py
      - name: Commit results
        if: steps.check.outputs.has_new == 'true'
        run: |
          git config user.name "gerald-bot"
          git config user.email "actions@github.com"
          git add classifier/results/ classifier/processed_nights.txt website/data/
          git diff --staged --quiet || git commit -m "Automated: classify new night(s)"
          git push
