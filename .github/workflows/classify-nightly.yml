name: Classify Gerald's Nightly Clips
on:
  schedule:
    # 15:00 UTC = 8:00 AM PDT (Pacific Daylight Time, UTC-7).
    # If clocks shift to PST (UTC-8) this becomes 7:00 AM PST -- close enough
    # either way, since Gerald's own upload finishes by ~7:05 AM.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      backfill_dates:
        description: 'Comma-separated dates to force-reprocess (e.g. 2026-08-22,2026-08-23). Leave blank for a normal run.'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Install Python dependencies
        run: pip install -r classifier/requirements.txt
      - name: Run classification pipeline
        env:
          BACKFILL_DATES: ${{ github.event.inputs.backfill_dates }}
        run: python3 classifier/scripts/run_pipeline.py
      - name: Commit results
        run: |
          git config user.name "gerald-bot"
          git config user.email "actions@github.com"
          git add classifier/results/ classifier/processed_nights.txt website/data/
          git diff --staged --quiet || git commit -m "Automated: classify new night(s)"
          git push
